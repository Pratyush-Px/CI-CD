name: StudentHub CI/CD Pipeline & Auto-Merge

on:
  push:
    branches:
      - '**' # Triggers on all branches (main, dev, feature/*, etc.)
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: 1. Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (node --test & Supertest)
        run: npm test

  auto-merge-to-main:
    name: 2. Auto-Merge into Main (if tests pass)
    needs: test
    runs-on: ubuntu-latest
    # Only run auto-merge if:
    # 1. Tests passed successfully
    # 2. Push was on a branch other than main (e.g. dev, test-branch)
    # 3. Trigger was a push
    if: github.event_name == 'push' && github.ref_name != 'main'
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge into Main
        run: |
          echo "Switching to main branch..."
          git checkout main
          echo "Merging branch '${{ github.ref_name }}' into main..."
          git merge --no-ff "origin/${{ github.ref_name }}" -m "ci: auto-merge branch '${{ github.ref_name }}' into main after passing tests [skip ci]"
          echo "Pushing merged changes to main..."
          git push origin main

  docker-publish:
    name: 3. Package & Publish Docker Container (GHCR)
    needs: [test, auto-merge-to-main]
    runs-on: ubuntu-latest
    # Run container packaging if tests succeeded AND merge succeeded (or was skipped because already on main)
    if: always() && needs.test.result == 'success' && (needs.auto-merge-to-main.result == 'success' || needs.auto-merge-to-main.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Tag
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Target Registry Image: $IMAGE_NAME:latest"

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
